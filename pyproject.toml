[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "stock-forecaster"
version = "1.0.0"
description = "LSTM-based stock price forecaster using OHLC data"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Developer"}]
requires-python = ">=3.8"
dependencies = [
    "tensorflow>=2.10.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "matplotlib>=3.4.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.11.0",
    "black>=21.5b2",
]

[project.scripts]
stock-forecaster = "stock_forecaster.cli:main"

[tool.setuptools.packages.find]
include = ["stock_forecaster*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["stock_forecaster"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
]